        Q1. Calculate Average Waiting Time for FCFS Scheduling:
      </text>
      <text x="0" y="18" font-family="sans-serif" font-size="11" fill="#334155">
        Processes: P1 (Burst: 6ms), P2 (Burst: 8ms), P3 (Burst: 7ms), P4 (Burst: 3ms)
      </text>

      <!-- Solution Box -->
      <g transform="translate(0, 30)">
