        <text x="12" y="32" font-family="'Fira Code', monospace" font-size="9.5" fill="#f8fafc">void round_robin(int processes[], int n, int bt[], int quantum) {</text>
        <text x="12" y="46" font-family="'Fira Code', monospace" font-size="9.5" fill="#94a3b8">    int wt[n], tat[n], total_wt = 0, total_tat = 0;</text>
