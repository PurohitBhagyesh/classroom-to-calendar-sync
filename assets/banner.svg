<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#181534" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121a2c" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Glowing Aurora Orbs -->
  <circle cx="180" cy="100" r="150" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1020" cy="260" r="170" fill="#818cf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="600" cy="350" r="140" fill="#c084fc" opacity="0.06" filter="url(#glow)" />

  <!-- Scattered Twinkling Stars (No Grid / No Squares) -->
  <g fill="#ffffff">
    <!-- Starfield Dots -->
    <circle cx="60" cy="80" r="1.5" opacity="0.6" />
    <circle cx="120" cy="220" r="1" opacity="0.4" />
    <circle cx="280" cy="50" r="2" opacity="0.8" />
    <circle cx="340" cy="180" r="1.5" opacity="0.5" />
    <circle cx="450" cy="90" r="1" opacity="0.6" />
    <circle cx="530" cy="40" r="2" opacity="0.7" />
    <circle cx="670" cy="130" r="1.5" opacity="0.5" />
    <circle cx="780" cy="60" r="2" opacity="0.9" />
    <circle cx="890" cy="170" r="1" opacity="0.4" />
    <circle cx="950" cy="40" r="1.5" opacity="0.8" />
    <circle cx="1120" cy="120" r="2" opacity="0.7" />
    <circle cx="1160" cy="260" r="1" opacity="0.5" />
    <circle cx="70" cy="360" r="1.5" opacity="0.6" />
    <circle cx="580" cy="210" r="1" opacity="0.5" />
    <circle cx="740" cy="370" r="2" opacity="0.7" />
  </g>

  <!-- 4-Point Sparkling Stars -->
  <!-- Star 1 (Top Left) -->
  <path d="M 160 50 Q 160 62 148 62 Q 160 62 160 74 Q 160 62 172 62 Q 160 62 160 50 Z" fill="#38bdf8" />
  <!-- Star 2 (Top Right) -->
  <path d="M 1060 60 Q 1060 74 1046 74 Q 1060 74 1060 88 Q 1060 74 1074 74 Q 1060 74 1060 60 Z" fill="#fef08a" />
  <!-- Star 3 (Mid Right) -->
  <path d="M 1140 180 Q 1140 190 1130 190 Q 1140 190 1140 200 Q 1140 190 1150 190 Q 1140 190 1140 180 Z" fill="#c084fc" />
  <!-- Star 4 (Bottom Left) -->
  <path d="M 60 280 Q 60 290 50 290 Q 60 290 60 300 Q 60 290 70 290 Q 60 290 60 280 Z" fill="#34d399" />
  <!-- Star 5 (Center) -->
  <path d="M 610 80 Q 610 88 602 88 Q 610 88 610 96 Q 610 88 618 88 Q 610 88 610 80 Z" fill="#ffffff" />

  <!-- Eyebrow Badge -->
  <g transform="translate(100, 50)">
    <rect width="320" height="32" rx="16" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
    <!-- Star inside badge -->
    <path d="M 22 11 Q 22 16 17 16 Q 22 16 22 21 Q 22 16 27 16 Q 22 16 22 11 Z" fill="#38bdf8" />
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="0.5">STUDENT PRODUCTIVITY AUTOMATION</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="100" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Google Classroom <tspan fill="url(#accentGrad)">→</tspan> Calendar &amp; AI Sync ✨
  </text>
  <text x="100" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Never miss an assignment again. Smart PDF deadline extraction + Gemini AI homework solver.
  </text>

  <!-- 4 Feature Cards (Smooth organic rounded corners) -->
  <g transform="translate(100, 225)">
    <rect width="230" height="120" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <rect width="4" height="60" rx="2" x="0" y="30" fill="#38bdf8" />
    <text x="20" y="44" font-size="22">📚</text>
    <text x="54" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Classroom Sync</text>
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Scans courses, posts &amp;</text>
    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Drive PDF attachments</text>
  </g>

  <g transform="translate(350, 225)">
    <rect width="230" height="120" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <rect width="4" height="60" rx="2" x="0" y="30" fill="#818cf8" />
    <text x="20" y="44" font-size="22">⚡</text>
    <text x="54" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#818cf8">PDF Deadlines</text>
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Extracts dates inside</text>
    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">syllabus &amp; lab sheets</text>
  </g>

  <g transform="translate(600, 225)">
    <rect width="230" height="120" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <rect width="4" height="60" rx="2" x="0" y="30" fill="#c084fc" />
    <text x="20" y="44" font-size="22">📅</text>
    <text x="54" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#c084fc">Calendar &amp; Tasks</text>
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">24h/2h popups + email</text>
    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">alerts with direct links</text>
  </g>

  <g transform="translate(850, 225)">
    <rect width="250" height="120" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <rect width="4" height="60" rx="2" x="0" y="30" fill="#34d399" />
    <text x="20" y="44" font-size="22">🤖</text>
    <text x="54" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#34d399">Gemini AI Solver</text>
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Generates answers &amp; PDF</text>
    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">solutions to your inbox</text>
  </g>
</svg>
