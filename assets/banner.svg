<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  
  <!-- Glowing background circles -->
  <circle cx="200" cy="120" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="280" r="160" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Badge -->
  <g transform="translate(100, 50)">
    <rect width="320" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#38bdf8" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="0.5">STUDENT PRODUCTIVITY AUTOMATION</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="100" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Google Classroom <tspan fill="url(#accentGrad)">→</tspan> Calendar &amp; AI Sync
  </text>
  <text x="100" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Never miss an assignment again. Smart PDF deadline extraction + Gemini AI homework solver.
  </text>

  <!-- 4 Feature Cards (Clean Frosted Glass WITHOUT Front Boxes) -->
  <!-- Card 1: Classroom Sync -->
  <g transform="translate(100, 220)">
    <rect width="230" height="120" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="44" font-size="22">📚</text>
    <text x="54" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Classroom Sync</text>
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Scans courses, posts &amp;</text>
    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Drive PDF attachments</text>
  </g>

  <!-- Card 2: PDF Parser -->
  <g transform="translate(350, 220)">
    <rect width="230" height="120" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="20" y="44" font-size="22">⚡</text>
    <text x="54" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">PDF Deadlines</text>
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Extracts dates inside</text>
    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">syllabus &amp; lab sheets</text>
  </g>

  <!-- Card 3: Calendar & Tasks -->
  <g transform="translate(600, 220)">
    <rect width="230" height="120" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
    <text x="20" y="44" font-size="22">📅</text>
    <text x="54" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#818cf8">Calendar &amp; Tasks</text>
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">24h/2h popups + email</text>
    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">alerts with direct links</text>
  </g>

  <!-- Card 4: Gemini AI -->
  <g transform="translate(850, 220)">
    <rect width="250" height="120" rx="14" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" />
    <text x="20" y="44" font-size="22">🤖</text>
    <text x="54" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#c084fc">Gemini AI Solver</text>
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Generates answers &amp; PDF</text>
    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">solutions to your inbox</text>
  </g>
</svg>
